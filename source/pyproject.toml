[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-extract"
version = "1.0.0"
description = "Extract Pakistani electricity bills into JSON and level1.csv."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.0.0",
    "docstring-parser>=0.16",
    "gitpython>=3.1.0",
    "tomli>=2.0.0",
]

[project.scripts]
bill-extract = "bill_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
